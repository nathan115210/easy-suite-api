services:
  postgres:
    image: postgres:17
    container_name: easy-suite-postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easy_meal}
      POSTGRES_USER: ${POSTGRES_USER:-easy_meal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easy_meal}
    volumes:
      - easy-suite-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  easy-suite-postgres-data:
